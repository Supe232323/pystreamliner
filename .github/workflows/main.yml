name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$TAG  pyproject=$PKG_VERSION"
          # Accept full match (v1.21.0 == 1.21.0) or major.minor tag (v1.21 == 1.21.0)
          if [ "$TAG" != "$PKG_VERSION" ] && [ "$TAG" != "${PKG_VERSION%.*}" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match pyproject version '$PKG_VERSION'"
            exit 1
          fi

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
