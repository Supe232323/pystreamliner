name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
  
    permissions:
      contents: read
      security-events: write

    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pystreamliner
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Checkout independent bench
        uses: actions/checkout@v6
        with:
          repository: Supe232323/streamlinerbench
          path: streamlinerbench

      - name: Run streamlinerbench
        run: python streamlinerbench/bench/run_bench.py

      - name: SARIF smoke (mixed case)
        run: |
          pystreamliner --dry-run --sarif streamlinerbench/bench/cases/11_mixed_realistic.py > results.sarif

      - name: Upload SARIF (optional, for Code Scanning)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
        continue-on-error: true

